# ============================================================
#  源清单 —— 你唯一需要经常修改的文件
# ============================================================
#  修改说明：
#   - 新增源：复制一段下面的配置，改 id / name / url 即可
#   - 停用源：把 enabled 改成 false（不要删，方便以后恢复）
#   - id 必须唯一，只能用英文字母、数字、连字符
#   - 改完直接提交到 GitHub，下次运行时自动生效
# ============================================================
#
#  ┌──────────────────────────────────────────────────────────┐
#  │  当前已接入（enabled: true）                              │
#  ├──────────────────────────────────────────────────────────┤
#  │  1. 教务处 教学通知                                       │
#  │     https://dean.xjtu.edu.cn/jxxx/jxtz2.htm              │
#  │     首页「通知公告」栏目点「更多」进入的列表页             │
#  │     取前 10 条，带日期                                    │
#  │                                                           │
#  │  2. 电气学院 本科生通知                                   │
#  │     https://ee.xjtu.edu.cn/jzxx/bks.htm                  │
#  │     首页「通知公告」中「本科生」标签页                     │
#  │     取前 10 条，带日期                                    │
#  └──────────────────────────────────────────────────────────┘
#
#  已停用（enabled: false，需要时改回 true 即可恢复）：
#    - 交大新闻网 要闻   https://news.xjtu.edu.cn/
# ============================================================

settings:
  # 每次运行最多推送多少条（防止某天集中更新把你淹没）
  max_items_per_run: 40
  # 每次运行最多对多少条做 AI 摘要（控制费用，超出的只给标题+链接）
  max_summary_per_run: 20
  # 每个源最多取回多少条
  max_items_per_source: 10
  # 只推送最近 N 小时内发布的内容。
  # 设 168（7 天）是因为高校通知更新频率低（通常一周几条），窗口太窄容易漏；
  # 配合去重机制，推过的内容不会重复出现，所以放宽窗口没有副作用。
  time_window_hours: 168

sources:
  # ============================================================
  #  西安交通大学教务处 · 教学通知
  #  首页「通知公告」栏目点击「更多」后进入的就是这个页面
  #  页面地址：https://dean.xjtu.edu.cn/jxxx/jxtz2.htm
  # ============================================================
  - id: xjtu-dean-notice
    name: 教务处 教学通知
    type: html
    url: https://dean.xjtu.edu.cn/jxxx/jxtz2.htm
    enabled: true
    item_selector: "ul.list li"      # 每一条通知
    title_selector: "a"              # 标题（自带 [分类] 前缀，如 [考试安排]）
    link_selector: "a"               # 链接所在元素
    link_attr: href                  # 取 href 属性
    date_selector: "span"            # 发布日期
    keywords: []
    max_items: 10

  # ============================================================
  #  西安交通大学电气工程学院 · 本科生通知
  #  首页「通知公告」栏目中「本科生」标签对应的列表页
  #  页面地址：https://ee.xjtu.edu.cn/jzxx/bks.htm
  # ============================================================
  - id: xjtu-ee-undergrad
    name: 电气学院 本科生通知
    type: html
    url: https://ee.xjtu.edu.cn/jzxx/bks.htm
    enabled: true
    item_selector: "div.list ul li"  # 每一条通知
    title_selector: "h3"             # 用 h3 可避开日期，只取正文标题
    link_selector: "a"               # 链接所在元素
    link_attr: href                  # 取 href 属性
    date_selector: "span"            # 发布日期
    keywords: []
    max_items: 10

  # ============================================================
  #  西安交通大学 新闻网（综合要闻）—— 已停用
  #  2026-10-10 按用户要求停用。需要时把 enabled 改回 true 即可恢复。
  #  注意：此页日期被拆成「日」「年-月」两个元素，程序无法解析，
  #        故未配 date_selector，改为「取前 10 条 + 去重」的方式工作。
  # ============================================================
  - id: xjtu-news
    name: 交大新闻网 要闻
    type: html
    url: https://news.xjtu.edu.cn/
    enabled: false
    item_selector: "ul.con-list2.clearfix li"
    title_selector: "a.btt"
    link_selector: "a.btt"
    link_attr: href
    keywords: []
    max_items: 10

  # ============================================================
  #  以下为模板示例，默认关闭，供你以后加源时参考
  # ============================================================

  # ---------- 类型一：RSS / Atom（最优先，能找到就用这个）----------
  - id: example-rss
    name: 示例机构公告
    type: rss
    url: https://example.com/feed.xml
    enabled: false
    keywords: []

  # ---------- 类型二：JSON 接口（很多现代网站页面背后的数据接口）----------
  # 如何找：浏览器打开目标页面 -> F12 -> Network -> Fetch/XHR，
  #         找一个返回 JSON 的请求，把它的地址填到 url
  - id: example-json
    name: 示例数据接口
    type: json
    url: https://api.example.com/news?pageSize=20
    enabled: false
    # items_path：列表在 JSON 里的位置，用点号分隔；顶层列表就写 "."
    items_path: data.list
    title_key: title
    url_key: url
    date_key: publishTime
    # 如果 url_key 取出来的是相对路径，用 url_prefix 补全
    url_prefix: ""
    keywords: []

  # ---------- 类型三：网页抓取（网站既没 RSS 也没有 JSON 接口时用）----------
  # 如何找选择器：浏览器打开页面 -> F12 -> 点左上角小箭头 -> 点中一条标题，
  #               在 HTML 里右键 -> Copy -> Copy selector
  # 注意：链接若是 ../xxx.htm 这类相对路径，程序会自动按页面地址补全，
  #       通常不需要填 url_prefix。
  - id: example-html
    name: 示例网页公告
    type: html
    url: https://example.com/announcements
    enabled: false
    item_selector: "ul.news-list li"
    title_selector: "a"
    link_selector: "a"
    link_attr: href
    date_selector: "span"
    keywords: []

  # ---------- 类型四：微信公众号（填转换服务输出的 feed 地址）----------
  # 本质也是 RSS，单独列出只为方便管理。
  # 微信通道的接入方式见 README「微信公众号接入」一节。
  - id: wechat-demo
    name: 公众号示例
    type: rss
    url: https://your-wechat-rss-host/feed/xxxx.xml
    enabled: false
    keywords: []
